<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена - KonturSMM</title>
  <meta name="theme-color" content="#1477ff">
  <script>
    try {
      const savedTheme = localStorage.getItem('kontursmm_theme');
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = savedTheme || (systemDark ? 'dark' : 'light');
    } catch (error) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
  <link rel="stylesheet" href="styles.css?v=2026-08-26">
</head>
<body>
  <main class="section" style="min-height: 100vh; display: grid; place-items: center;">
    <div class="container" style="text-align: center; max-width: 760px;">
      <img src="assets/logo.svg" alt="KonturSMM" width="232" height="54" style="margin: 0 auto 32px;">
      <p class="section-kicker">404</p>
      <h1 class="section-title" style="margin: 0 auto 18px;">Такой страницы нет</h1>
      <p class="section-copy" style="margin: 0 auto 28px;">Вернитесь на главную и откройте AI-радар вашей ниши.</p>
      <a class="btn btn-primary" href="/">На главную</a>
    </div>
  </main>
</body>
</html>
